# Decap CMS configuration for Casa Yun
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: elpuntoyun-dotcom/casa-yun
  branch: main
  # OAuth 登录网关:站内的 /api/auth 与 /api/callback (Vercel serverless functions)。
  # 配合在 GitHub 注册的 OAuth App 使用,Client ID/Secret 放在 Vercel 环境变量里。
  base_url: https://casayun.com
  auth_endpoint: api/auth

# 站内图片:构建输出里图片放在站点根目录的 assets/ 下,
# 所以编辑器里选图后写入的路径就是 assets/xxx.jpg(与现有引用一致)。
media_folder: "assets"
public_folder: "assets"

collections:
  - name: "posts"
    label: "博客文章"
    label_singular: "文章"
    description: "Casa Yun 博客文章。文件名固定为 <slug>.<lang>.md,共六种语言各一篇。"
    folder: "content/posts"
    create: true
    # 文件名模板:slug 字段 + lang 字段,例如 ppk-old-age.zh.md
    slug: "{{slug}}.{{lang}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "Slug(网址代号,英文小写)", name: "slug", widget: "string", hint: "例如 ppk-old-age,决定文件名" }
      - { label: "语言", name: "lang", widget: "select",
          options: ["en", "zh", "zhHans", "es", "pt", "ja"],
          hint: "en=英文 zh=繁中 zhHans=简中 es=西语 pt=葡语 ja=日语" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "栏目标签", name: "category", widget: "string" }
      - { label: "摘要(首页卡片用)", name: "excerpt", widget: "text" }
      - { label: "返回链接文字", name: "back_label", widget: "string" }
      - { label: "显示日期(各语言写法)", name: "date_display", widget: "string",
          hint: "例如 2026年10月4日 / October 4, 2026" }
      - { label: "阅读全文按钮文字", name: "read_label", widget: "string" }
      - { label: "题图", name: "hero_image", widget: "image", required: false }
      - { label: "题图 alt 说明", name: "hero_alt", widget: "string", required: false }
      - { label: "推荐徽标(仅 kefir 首页大卡用)", name: "spotlight_badge", widget: "string", required: false }
      - { label: "首页卡片栏目标签", name: "featured_label", widget: "string" }
      - { label: "栏目列表条目(仅 ppk 用)", name: "chapter_listing", widget: "string", required: false }
      - { label: "栏目详情阅读链接文字", name: "article_read", widget: "string" }
      - { label: "文内配图 alt(仅 ppk 第二张图用)", name: "photo_alt_1", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown", hint: "段落直接写;小标题用 ## ;配图用图片按钮插入(alt 文字会同时作为图注)" }
